name: tests
on: [push, pull_request]
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas fastapi pytest httpx
      - run: python -m pytest -q tests
